<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Payoff and Risk - test suite</title>
<style>
 body{margin:0;padding:24px;background:#050607;color:#e9edf0;font:13px ui-monospace,Menlo,Consolas,monospace;}
 h1{font-size:15px;margin:0 0 4px;} .sub{color:#697079;font-size:11px;margin-bottom:16px;}
 .grp{margin:14px 0 6px;color:#4ade80;font-size:11px;letter-spacing:.08em;}
 .t{padding:3px 0;border-bottom:1px solid #191c21;display:flex;gap:10px;}
 .t .s{width:46px;font-weight:700;} .pass .s{color:#4ade80;} .fail .s{color:#ff5a52;}
 .t .d{flex:1;} .t .m{color:#697079;}
 #sum{margin-top:18px;padding:12px 14px;border-radius:8px;font-weight:700;}
 .ok{background:rgba(74,222,128,.12);color:#4ade80;} .bad{background:rgba(255,90,82,.12);color:#ff5a52;}
 #spay-host{display:none !important;}
</style></head>
<body>
<h1>Payoff &amp; Risk - test suite</h1>
<div class="sub">Pure-function tests over the pricing, parsing, risk and session logic. Open this file to re-run.</div>
<div id="out"></div><div id="sum">running...</div>
<script>document.write('<script src="../straddly-payoff.user.js?v='+Date.now()+'"><\/script>');</script>
<script>
(function(){
  var out=document.getElementById('out'), pass=0, fail=0, failed=[];
  function grp(n){ var d=document.createElement('div'); d.className='grp'; d.textContent=n; out.appendChild(d); }
  function t(desc, fn){
    var okv=false, msg='';
    try { var r=fn(); okv = r===true || r===undefined; if(!okv) msg=String(r); }
    catch(e){ okv=false; msg=(e && e.message) || String(e); }
    okv?pass++:(fail++, failed.push(desc+' :: '+msg));
    var d=document.createElement('div'); d.className='t '+(okv?'pass':'fail');
    d.innerHTML='<span class="s">'+(okv?'PASS':'FAIL')+'</span><span class="d"></span><span class="m"></span>';
    d.querySelector('.d').textContent=desc; d.querySelector('.m').textContent=msg; out.appendChild(d);
  }
  function near(a,b,tol,label){ if(Math.abs(a-b)<=tol) return true; return (label||'')+' got '+a+' want ~'+b+' (+/-'+tol+')'; }

  function run(){
    var BS=window.BS, F=window.SPAY._fn, S=window.SPAY, K=F.marketConsts;

    grp('SECURITY');
    t('bearer token is not reachable via window.SPAY', function(){
      var hit=[]; (function scan(o,path,d){ if(!o||d>2) return;
        Object.keys(o).forEach(function(k){ var v=o[k];
          if(typeof v==='string' && /^bearer /i.test(v)) hit.push(path+'.'+k);
          else if(v && typeof v==='object') scan(v,path+'.'+k,d+1); }); })(S,'SPAY',0);
      return hit.length===0 || 'token exposed at '+hit.join(', ');
    });
    t('SPAY exposes no auth key at all', function(){ return !('auth' in S) || 'SPAY.auth still present'; });

    grp('SESSION / EXPIRY');
    t('session close is 15:40 (NSE+BSE, since 2026-08-03)', function(){
      return (K.CLOSE_H===15 && K.CLOSE_M===40) || 'got '+K.CLOSE_H+':'+K.CLOSE_M; });
    t('symbol expiry uses the 15:40 close', function(){
      var p=F.parseSymbol('NIFTY26082024300CE');
      return (p.expiry.getHours()===15 && p.expiry.getMinutes()===40) || 'got '+p.expiry; });
    t('symbol parses underlying/strike/type', function(){
      var p=F.parseSymbol('BANKNIFTY26082557800CE');
      return (p.underlying==='BANKNIFTY' && p.strike===57800 && p.type==='CE') || JSON.stringify(p); });
    function atIST(y,mo,d,h,mi){ return new Date(Date.UTC(y,mo-1,d,h,mi)-5.5*3600000); }
    t('weekday mid-session is OPEN',        function(){ return F.marketState(atIST(2026,8,20,12,0))==='OPEN'; });
    t('09:14 IST is CLOSED (pre-open)',     function(){ return F.marketState(atIST(2026,8,20,9,14))==='CLOSED'; });
    t('09:15 IST is OPEN',                  function(){ return F.marketState(atIST(2026,8,20,9,15))==='OPEN'; });
    t('15:40 IST is OPEN (last minute)',    function(){ return F.marketState(atIST(2026,8,20,15,40))==='OPEN'; });
    t('15:41 IST is CLOSED',                function(){ return F.marketState(atIST(2026,8,20,15,41))==='CLOSED'; });
    t('Saturday is CLOSED (frozen-feed trap)', function(){ return F.marketState(atIST(2026,8,22,12,0))==='CLOSED'; });
    t('Sunday is CLOSED',                   function(){ return F.marketState(atIST(2026,8,23,12,0))==='CLOSED'; });

    grp('BLACK-SCHOLES');
    var S0=24000,T=7/365,r=.065,v=.14;
    t('put-call parity holds', function(){
      var c=BS.price(S0,24000,T,r,v,'CE'), p=BS.price(S0,24000,T,r,v,'PE');
      return near(c-p, S0-24000*Math.exp(-r*T), 0.5, 'C-P'); });
    t('call price rises with vol', function(){
      return BS.price(S0,24200,T,r,.20,'CE') > BS.price(S0,24200,T,r,.10,'CE'); });
    t('at expiry the price is intrinsic', function(){
      return near(BS.price(24350,24000,0,r,v,'CE'), 350, 1e-9, 'intrinsic'); });
    t('call delta in (0,1), put delta in (-1,0)', function(){
      var c=BS.greeks(S0,24000,T,r,v,'CE',1).delta, p=BS.greeks(S0,24000,T,r,v,'PE',1).delta;
      return (c>0&&c<1&&p>-1&&p<0) || 'CE '+c+' PE '+p; });
    t('a short position flips the delta sign', function(){
      return BS.greeks(S0,24000,T,r,v,'CE',-65).delta < 0; });

    grp('IMPLIED VOL - must refuse bad marks');
    t('round-trips a fair price', function(){
      var px=BS.price(S0,24200,T,r,.135,'CE');
      return near(BS.iv(S0,24200,T,r,px,'CE'), .135, .002, 'iv'); });
    t('rejects a mark at or below intrinsic', function(){
      var got=BS.iv(24350,24000,T,r,340,'CE'); return got===0 || 'got '+got; });
    t('rejects an absurdly rich mark (not 500pct vol)', function(){
      var got=BS.iv(S0,24200,T,r,9000,'CE'); return got===0 || 'got '+got; });
    t('rejects zero and negative marks', function(){
      return (BS.iv(S0,24200,T,r,0,'CE')===0 && BS.iv(S0,24200,T,r,-5,'CE')===0); });
    t('never returns a vol outside the 1pct-300pct band', function(){
      for(var m=0.05;m<3000;m*=1.7){ var got=BS.iv(S0,24200,T,r,m,'CE');
        if(got!==0 && (got<K.IV_MIN||got>K.IV_MAX)) return 'mark '+m.toFixed(2)+' gave iv '+got; }
      return true; });
    t('a zero LTP falls back to the entry price rather than being rejected', function(){
      var legs=[{strike:24000,type:'CE',qty:-65,avg:100,ltp:0,expiry:new Date(Date.now()+2*864e5)}];
      var ctx=window._getPosCtx(legs,S0);
      return (ctx.ivBad===0 && ctx.legIVs[0]>0) || 'ivBad='+ctx.ivBad+' iv='+ctx.legIVs[0]; });
    t('an unsolvable leg is flagged in ivBad and borrows a sibling vol', function(){
      var e=new Date(Date.now()+2*864e5);
      var legs=[{strike:24000,type:'CE',qty:-65,avg:420,ltp:420,expiry:e},   // below intrinsic at spot 24500
                {strike:24600,type:'CE',qty:-65,avg:120,ltp:120,expiry:e}];  // solves normally
      var ctx=window._getPosCtx(legs,24500);
      return (ctx.ivBad===1 && ctx.legIVs[0]===ctx.ivFallback && ctx.legIVs[0]>0)
        || 'ivBad='+ctx.ivBad+' ivs='+ctx.legIVs.join(',')+' fb='+ctx.ivFallback; });

    grp('POSITION P&L');
    var exp2=new Date(Date.now()+2*864e5);
    function leg(strike,type,qty,avg,ltp){ return {strike:strike,type:type,qty:qty,avg:avg,ltp:ltp,expiry:exp2,under:'NIFTY',symbol:'X'+strike+type}; }
    t('a SHORT leg profits when the option cheapens', function(){
      var L=[leg(24300,'CE',-65,50,30)], c=window._getPosCtx(L,24000);
      return window._bsPnl(L,24000,c,0) > 0; });
    t('a LONG leg profits when the option richens (sign fix)', function(){
      var L=[leg(24300,'CE',65,30,50)], c=window._getPosCtx(L,24000);
      var lo=window._bsPnl(L,23500,c,0), hi=window._bsPnl(L,24800,c,0);
      return hi>lo || 'low '+lo+' high '+hi; });
    t('a short strangle peaks between the strikes', function(){
      var L=[leg(24200,'PE',-65,40,40), leg(24300,'CE',-65,40,40)], c=window._getPosCtx(L,24250);
      var mid=window._bsPnl(L,24250,c,0), lo=window._bsPnl(L,23600,c,0), hi=window._bsPnl(L,24900,c,0);
      return (mid>lo && mid>hi) || 'mid '+mid+' lo '+lo+' hi '+hi; });
    t('legs keep their OWN expiries in a mixed-expiry book', function(){
      var n1=new Date(Date.now()+1*864e5), far=new Date(Date.now()+8*864e5);
      var L=[{strike:24000,type:'CE',qty:-65,avg:50,ltp:50,expiry:n1},
             {strike:24000,type:'CE',qty:-65,avg:90,ltp:90,expiry:far}];
      var c=window._getPosCtx(L,24000);
      return (Math.abs(c.legT[0]-c.legT[1])>1e-4 && c.dte<2) || 'legT '+c.legT.join(',')+' dte '+c.dte; });
    t('breakevens straddle spot for a short strangle', function(){
      var L=[leg(24200,'PE',-65,40,40), leg(24300,'CE',-65,40,40)];
      S.positions=[]; S.spots={NIFTY:24250}; S.book='NIFTY';
      var be=window._breakevens(L);
      return (be && be.lower<24250 && be.upper>24250) || JSON.stringify(be); });

    grp('REALISED P&L ON EXIT');
    function setLegs(arr){ S.positions=arr.map(function(a){
      return {status:'OPEN',symbol:a[0],optionType:a[0].slice(-2),strikePrice:a[1],quantity:a[2],
              avgSellPrice:a[3],bepPrice:a[3],ltp:a[4],_scraped:true,
              expiryDate:new Date(Date.now()+2*864e5).toISOString()}; }); }
    t('a fully exited leg banks its last P&L', function(){
      S.realised={}; S.prevLegs={}; S.posVisible=true;
      setLegs([['NIFTY26082024200PE',24200,-20,50,40]]); F.reconcileRealised();
      setLegs([]);                                       F.reconcileRealised();
      return near(S.realised.NIFTY, 200, 1, 'realised'); });
    t('a PARTIAL exit banks only the closed fraction', function(){
      S.realised={}; S.prevLegs={}; S.posVisible=true;
      setLegs([['NIFTY26082024200PE',24200,-20,50,40]]); F.reconcileRealised();
      setLegs([['NIFTY26082024200PE',24200,-5,50,40]]);  F.reconcileRealised();
      return near(S.realised.NIFTY, 150, 1, 'realised'); });
    t('an untouched book banks nothing when the mark moves', function(){
      S.realised={}; S.prevLegs={}; S.posVisible=true;
      setLegs([['NIFTY26082024200PE',24200,-20,50,40]]); F.reconcileRealised();
      setLegs([['NIFTY26082024200PE',24200,-20,50,35]]); F.reconcileRealised();
      return near(S.realised.NIFTY||0, 0, 1e-9, 'realised'); });

    grp('HISTORY');
    t('samples are throttled, not written on every call', function(){
      S.hist={}; S.histDay=F.dayKey();
      for(var i=0;i<50;i++) F.histPush('NIFTY', 100+i, -5);
      var n=(S.hist.NIFTY||[]).length;
      return n===1 || 'wrote '+n+' samples in a tight loop'; });
    t('a sample carries [t, mtm, delta, realised]', function(){
      var s0=S.hist.NIFTY[0];
      return (s0.length===4 && typeof s0[0]==='number') || JSON.stringify(s0); });
    t('a new trading day resets the series and the booked total', function(){
      S.histDay='2026-01-01'; S.hist={NIFTY:[[1,2,3,4]]}; S.realised={NIFTY:999};
      F.histPush('NIFTY', 10, -1);
      return (S.histDay===F.dayKey() && S.hist.NIFTY.length===1 && !S.realised.NIFTY)
        || ('day '+S.histDay+' pts '+S.hist.NIFTY.length+' realised '+S.realised.NIFTY); });

    grp('ALERTS');
    F.AL.sound=false; F.AL.desktop=false; F.AL.flash=false;
    function armAll(){ Object.keys(F.ALS).forEach(function(k){ delete F.ALS[k]; }); F.ALOG.length=0; }
    function openBook(dayPnl, spot, lo, hi){
      // a short strangle whose breakevens bracket lo..hi, marked so day P&L lands on dayPnl
      var e=new Date(Date.now()+2*864e5);
      S.positions=[
        {status:'OPEN',symbol:'NIFTY26082024200PE',optionType:'PE',strikePrice:lo+40,quantity:-20,avgSellPrice:40,bepPrice:40,ltp:40-dayPnl/40,_scraped:true,expiryDate:e.toISOString()},
        {status:'OPEN',symbol:'NIFTY26082024300CE',optionType:'CE',strikePrice:hi-40,quantity:-20,avgSellPrice:40,bepPrice:40,ltp:40-dayPnl/40,_scraped:true,expiryDate:e.toISOString()}];
      S.spots={NIFTY:spot}; S.book='NIFTY'; S.realised={}; S.posVisible=true;
      S.markAt=Date.now(); S.tickAt=Date.now(); S.peak={};   // healthy feed, no high-water mark
    }
    t('nothing fires while the market is CLOSED', function(){
      armAll(); F.AL.on=true; F.AL.health=true; F.AL.be=40;
      S.markAt=Date.now()-600000; S.tickAt=Date.now()-600000;  // very sick feed
      F.evalAlerts('CLOSED');
      return F.ALOG.length===0 || 'fired '+F.ALOG.length+' alerts with the market closed'; });
    t('a dead feed raises FEED PROBLEM', function(){
      armAll(); F.AL.on=true; F.AL.health=true;
      openBook(0, 24250, 24100, 24400); S.markAt=Date.now()-600000; S.tickAt=Date.now()-600000;
      F.evalAlerts('OPEN');
      return (F.ALOG.length===1 && /FEED PROBLEM/.test(F.ALOG[0].msg)) || JSON.stringify(F.ALOG.map(function(a){return a.msg;})); });
    t('a dead feed SUPPRESSES the P&L stop (never act on a frozen mark)', function(){
      armAll(); F.AL.on=true; F.AL.health=false; F.AL.stop=-1000; F.AL.be=0; F.AL.dlt=0; F.AL.tgt=0;
      openBook(-9999, 24250, 24100, 24400); S.markAt=Date.now()-600000; S.tickAt=Date.now()-600000;
      F.evalAlerts('OPEN');
      return F.ALOG.length===0 || 'fired: '+F.ALOG[0].msg; });
    t('a breached breakeven fires once, not on every tick', function(){
      armAll(); F.AL.on=true; F.AL.health=false; F.AL.be=40; F.AL.tgt=0; F.AL.stop=0; F.AL.dlt=0;
      openBook(0, 26000, 24100, 24400);   // spot far outside
      for(var i=0;i<8;i++) F.evalAlerts('OPEN');
      var breach=F.ALOG.filter(function(a){ return /BREACH/.test(a.msg); });
      return breach.length===1 || 'fired '+breach.length+' times over 8 ticks'; });
    t('an alert names the book it belongs to', function(){
      return /NIFTY/.test((F.ALOG[0]||{}).msg||'') || 'no book in "'+((F.ALOG[0]||{}).msg||'')+'"'; });
    t('a disarmed rule re-arms only after the value pulls back', function(){
      armAll(); F.AL.on=true; F.AL.health=false; F.AL.be=40; F.AL.tgt=0; F.AL.stop=0; F.AL.dlt=0;
      openBook(0, 26000, 24100, 24400); F.evalAlerts('OPEN');          // breach -> fires, disarms
      var after1=F.ALOG.length;
      openBook(0, 24250, 24100, 24400); F.evalAlerts('OPEN');          // back inside -> re-arms, no fire
      openBook(0, 26000, 24100, 24400); F.ALS['NIFTY:beBreach'].at=0; F.evalAlerts('OPEN'); // breach again
      return (F.ALOG.length===after1+1) || 'log went '+after1+' -> '+F.ALOG.length; });
    t('alerts off means silence', function(){
      armAll(); F.AL.on=false; F.AL.be=40;
      openBook(0, 26000, 24100, 24400);
      F.evalAlerts('OPEN'); F.AL.on=true;
      return F.ALOG.length===0 || 'fired while off'; });

    t('the leg cache self-invalidates outside a refresh frame', function(){
      var e=new Date(Date.now()+2*864e5);
      S.positions=[{status:'OPEN',symbol:'NIFTY26082024200PE',optionType:'PE',strikePrice:24200,quantity:-20,
                    avgSellPrice:50,bepPrice:50,ltp:40,_scraped:true,expiryDate:e.toISOString()}];
      S.posVisible=true; var a=window._allLegs().length;
      S.positions=[];                       // change positions WITHOUT calling refreshAll
      var b=window._allLegs().length;
      return (a===1 && b===0) || 'legs went '+a+' -> '+b+' (cache went stale)'; });
    t('giveback fires when an open profit is handed back', function(){
      armAll(); F.AL.on=true; F.AL.health=false; F.AL.be=0; F.AL.tgt=0; F.AL.stop=0; F.AL.dlt=0; F.AL.give=3000;
      openBook(1500, 24250, 24100, 24400); S.peak={NIFTY:5000};
      F.evalAlerts('OPEN');
      var ok=F.ALOG.length===1 && /GIVING BACK/.test(F.ALOG[0].msg);
      F.AL.give=0; return ok || 'log: '+JSON.stringify(F.ALOG.map(function(a){return a.msg;})); });
    t('no giveback while sitting at the day high', function(){
      armAll(); F.AL.health=false; F.AL.be=0; F.AL.tgt=0; F.AL.stop=0; F.AL.dlt=0; F.AL.give=3000;
      openBook(1500, 24250, 24100, 24400); S.peak={NIFTY:1500};
      F.evalAlerts('OPEN'); var ok=F.ALOG.length===0; F.AL.give=0;
      return ok || 'fired: '+F.ALOG[0].msg; });
    t('no giveback on a day that never went green', function(){
      armAll(); F.AL.health=false; F.AL.be=0; F.AL.tgt=0; F.AL.stop=0; F.AL.dlt=0; F.AL.give=500;
      openBook(-2000, 24250, 24100, 24400); S.peak={NIFTY:-200};
      F.evalAlerts('OPEN'); var ok=F.ALOG.length===0; F.AL.give=0;
      return ok || 'fired: '+F.ALOG[0].msg; });

    grp('THEME');
    function lum(c){ var m=c.match(/\d+/g).map(Number).slice(0,3).map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);}); return .2126*m[0]+.7152*m[1]+.0722*m[2]; }
    function cr(fg,bg){ var a=lum(fg),b=lum(bg); return (Math.max(a,b)+.05)/(Math.min(a,b)+.05); }
    function worstContrast(){
      var SRr=window._SPR, pb=getComputedStyle(SRr.querySelector('#spay')).backgroundColor, worst=99, who='';
      ['.gl','.gv','.rl','.rv','.rs','.hs','.lbl','.wm','.books button','#spay-day'].forEach(function(sel){
        var e=SRr.querySelector(sel); if(!e) return; var v=cr(getComputedStyle(e).color, pb);
        if(v<worst){ worst=v; who=sel; } });
      return {ratio:+worst.toFixed(2), el:who};
    }
    t('no text falls below 4.5:1 in either theme after switching', function(){
      var SRr=window._SPR, btn=SRr.querySelector('#spay-theme'), out=[];
      for (var i=0;i<4;i++){ btn.click(); var w=worstContrast(); out.push(S.theme+' '+w.el+' '+w.ratio);
        if (w.ratio < 4.5) return 'FAILED in '+S.theme+' at '+w.el+' = '+w.ratio+':1 (sequence: '+out.join(' | ')+')'; }
      return true; });
    t('switching theme leaves no stale inline colour behind', function(){
      var SRr=window._SPR, btn=SRr.querySelector('#spay-theme');
      btn.click(); var a=SRr.querySelector('.rv').style.color;
      btn.click(); var b=SRr.querySelector('.rv').style.color;
      // either cleared, or re-set from the CURRENT palette - never a leftover from the other theme
      return (a===b) || 'inline colour drifted across themes: "'+a+'" -> "'+b+'"'; });

    grp('PRICE SOURCE / RECONCILIATION');
    function oneLeg(){ var e=new Date(Date.now()+2*864e5);
      S.positions=[{status:'OPEN',symbol:'NIFTY26082024200PE',optionType:'PE',strikePrice:24200,quantity:-20,
                    avgSellPrice:50,bepPrice:50,ltp:40,_scraped:true,expiryDate:e.toISOString()}];
      S.posVisible=true; S.ltpBySym={'NIFTY26082024200PE':999}; S.spots={NIFTY:24250}; S.book='NIFTY'; }
    t('live foreground: the on-screen table beats a self-fetched quote', function(){
      oneLeg(); S.tableAt=Date.now()-2000; S.quoteAt=Date.now()-1000;
      var v=window._allLegs()[0].ltp; return v===40 || 'used '+v+' instead of the table value 40'; });
    t('quiet market: a table that simply has not ticked is still trusted', function(){
      oneLeg(); S.tableAt=Date.now()-300000; S.quoteAt=Date.now()-300000;
      var v=window._allLegs()[0].ltp; return v===40 || 'used '+v+' — mistook a quiet market for a frozen page'; });
    t('a readable row always wins, even against a fresher quote (v4.5 rule)', function(){
      // Deliberate: timestamp heuristics kept handing the display to stale or mis-mapped quotes, so the
      // portal's own row now wins whenever we can read it. A page that has stopped updating is reported
      // by the FROZEN badge instead of being silently papered over with quote data.
      oneLeg(); S.tableAt=Date.now()-120000; S.quoteAt=Date.now()-1000;
      var v=window._allLegs()[0].ltp; return v===40 || 'used '+v+' instead of the row value 40'; });
    t('off-tab (row not readable) falls back to our own quotes', function(){
      oneLeg(); S.posVisible=false;
      var v=window._allLegs()[0].ltp; S.posVisible=true;
      return v===999 || 'used '+v+' — should have fallen back to the quote'; });
    t('portal total is parsed from the page', function(){
      var host=document.createElement('div'); host.textContent='Total MTM : ₹29.25'; document.body.appendChild(host);
      F.scrapePositions(true); var got=S.portalMTM; host.remove();
      return got===29.25 || 'parsed '+got; });

    t("P&L uses the portal's own P&L column, not a re-derivation", function(){
      var e=new Date(Date.now()+2*864e5);
      S.positions=[{status:'OPEN',symbol:'NIFTY26082524350CE',optionType:'CE',strikePrice:24350,quantity:-65,
                    avgSellPrice:167,bepPrice:167,ltp:167.70,_pnl:-45.50,_scraped:true,expiryDate:e.toISOString()}];
      S.posVisible=true; S.ltpBySym={}; S.tableAt=Date.now(); S.quoteAt=Date.now(); S.spots={NIFTY:24334}; S.book='NIFTY';
      var v=window.parseOpenPos()[0].pnl;
      return Math.abs(v-(-45.50))<0.01 || 'got '+v+' want -45.50'; });
    t('splitting a straddle preserves the book P&L exactly', function(){
      var e=new Date(Date.now()+2*864e5);
      S.positions=[{status:'OPEN',symbol:'NIFTY26082524350SD',optionType:'SD',strikePrice:24350,quantity:-65,
                    avgSellPrice:167,bepPrice:167,ltp:167.70,_pnl:-45.50,_scraped:true,expiryDate:e.toISOString()}];
      S.posVisible=true; S.tableAt=Date.now(); S.quoteAt=Date.now(); S.spots={NIFTY:24334}; S.book='NIFTY';
      // component quotes that do NOT sum to the straddle mark - the real-world failure
      S.ltpBySym={'NIFTY26082524350CE':300,'NIFTY26082524350PE':250};
      var legs=window._allLegs(), sum=legs.reduce(function(a,l){return a+l.pnl;},0);
      return (legs.length===2 && Math.abs(sum-(-45.50))<0.01)
        || legs.length+' legs summing to '+Math.round(sum)+' instead of -45.50'; });

    grp('STRADDLE (SD) ROWS');
    function sdBook(){
      var e=new Date(Date.now()+2*864e5);
      S.positions=[{status:'OPEN',symbol:'NIFTY26082524200SD',optionType:'SD',strikePrice:24200,quantity:-65,
                    avgSellPrice:167,bepPrice:167,ltp:159.05,_pnl:516.75,_scraped:true,expiryDate:e.toISOString()}];
      S.posVisible=true; S.spots={NIFTY:24334}; S.book='NIFTY'; S.realised={};
      S.tableAt=Date.now(); S.quoteAt=Date.now();
    }
    t("a straddle keeps its OWN mark, never CE+PE from separate quotes", function(){
      sdBook(); S.ltpBySym={'NIFTY26082524200CE':157.40,'NIFTY26082524200PE':17.55}; // sum 174.95, 16 pts off
      var v=window.parseOpenPos()[0].ltp;
      return Math.abs(v-159.05)<0.01 || 'used '+v+' instead of the row mark 159.05'; });
    t('a straddle P&L keeps the portal sign (the reported bug)', function(){
      sdBook(); S.ltpBySym={'NIFTY26082524200CE':157.40,'NIFTY26082524200PE':17.55};
      var legs=window._allLegs(), sum=legs.reduce(function(a,l){return a+l.pnl;},0);
      return Math.abs(sum-516.75)<0.01 || 'legs sum to '+Math.round(sum)+' but the portal says +516.75'; });
    t('component quotes that disagree with the mark are refused and flagged', function(){
      sdBook(); S.ltpBySym={'NIFTY26082524200CE':157.40,'NIFTY26082524200PE':17.55};
      var legs=window._allLegs();
      return (legs[0]._est===true && Math.abs(legs[0].ltp-159.05/2)<0.01) || 'ltp '+legs[0].ltp+' est '+legs[0]._est; });
    t('component quotes that DO reconcile are used for the split', function(){
      sdBook(); S.ltpBySym={'NIFTY26082524200CE':140.05,'NIFTY26082524200PE':19.00}; // sums to 159.05
      var legs=window._allLegs(), sum=legs.reduce(function(a,l){return a+l.pnl;},0);
      return (!legs[0]._est && Math.abs(legs[0].ltp-140.05)<0.01 && Math.abs(sum-516.75)<0.01)
        || 'est='+legs[0]._est+' ltp='+legs[0].ltp+' sum='+sum; });

    grp('SPOT SOURCE');
    t('a spot from a different index is rejected for this book', function(){
      sdBook(); return !F.plausibleSpot('NIFTY', 57390) || 'accepted 57390 for a 24200-strike book'; });
    t("a spot near this book's strikes is accepted", function(){
      sdBook(); return F.plausibleSpot('NIFTY', 24341) || 'rejected a valid 24341'; });

    grp('ORDER BOOK');
    function ordRow(sym, side, qty, price, status){
      return {symbol:sym, operationType:side, quantity:qty, lotSize:65, inputPrice:price,
              rateType:'limit', status:status, price:0, triggerPrice:0};
    }
    t('an order payload normalises to lots and a clean side', function(){
      var o=F.normOrder(ordRow('NIFTY26082524500CE','sell',130,22,'open'));
      return (o.side==='SELL' && o.lots===2 && o.asked===22) || JSON.stringify(o); });
    t('BUY orders are not mislabelled as SELL', function(){
      var o=F.normOrder(ordRow('NIFTY26082524500CE','buy',65,4.2,'open'));
      return o.side==='BUY' || 'got '+o.side; });
    t('executed and cancelled orders are not shown as working', function(){
      var w=['open','pending','trigger pending','executed','cancelled','rejected']
        .map(function(st){ return F.isWorking(F.normOrder(ordRow('NIFTY26082524500CE','sell',65,22,st))); });
      return JSON.stringify(w)===JSON.stringify([true,true,true,false,false,false]) || JSON.stringify(w); });
    t('a resting SELL above the market needs spot to RISE', function(){
      var e=new Date(Date.now()+2*864e5);
      S.positions=[]; S.spots={NIFTY:24341}; S.book='NIFTY';
      S.ltpBySym={'NIFTY26082524500CE':15.80};
      var o=F.normOrder(ordRow('NIFTY26082524500CE','sell',65,22,'open'));
      var d=F.orderDistance(o);
      return (d && d.prem>0 && d.dSpot>0) || JSON.stringify(d); });
    t('a resting SELL on a PUT needs spot to FALL', function(){
      S.positions=[]; S.spots={NIFTY:24341}; S.book='NIFTY';
      S.ltpBySym={'NIFTY26082524000PE':28.90};
      var o=F.normOrder(ordRow('NIFTY26082524000PE','sell',65,31.5,'open'));
      var d=F.orderDistance(o);
      return (d && d.prem>0 && d.dSpot<0) || JSON.stringify(d); });
    t('distance is reported in sigmas with a touch probability in 0..1', function(){
      S.positions=[]; S.spots={NIFTY:24341}; S.book='NIFTY';
      S.ltpBySym={'NIFTY26082524500CE':15.80};
      var d=F.orderDistance(F.normOrder(ordRow('NIFTY26082524500CE','sell',65,22,'open')));
      return (d.sigmas>0 && d.touch>0 && d.touch<=1) || JSON.stringify(d); });
    t('lot sizes match the broker contract sizes', function(){
      return (F.LOTS.NIFTY===65 && F.LOTS.BANKNIFTY===30 && F.LOTS.SENSEX===20) || JSON.stringify(F.LOTS); });

    var sum=document.getElementById('sum');
    sum.className = fail ? 'bad' : 'ok';
    sum.textContent = fail ? (fail+' FAILED of '+(pass+fail)+' :: '+failed[0]) : ('ALL '+pass+' TESTS PASSED');
    window.__RESULT={pass:pass, fail:fail, failed:failed};
  }
  (function wait(){ if(window.BS && window.SPAY && window.SPAY._fn) return run(); setTimeout(wait,40); })();
})();
</script>
